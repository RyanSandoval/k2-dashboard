<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><style>
body{display:flex;flex-direction:column;min-height:100vh}
.hd{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:baseline}
.hd .c{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.hd .s{font-size:11px;color:var(--ink3)}
.prog{height:3px;background:var(--rule);margin:14px 20px 0;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:58%;background:var(--acc)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px}
.why{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:14px}
.q{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.22}
.meta{margin-top:16px;font-size:13px;color:var(--ink3);line-height:1.7}
.meta b{color:var(--ink2);font-weight:600}
.acts{padding:0 20px 34px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{padding:16px 12px;border-radius:14px;border:1px solid var(--rule);background:var(--raise);
color:var(--ink);font:700 14px 'Plus Jakarta Sans';cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.acts button span{font-size:11px;font-weight:500;color:var(--ink3)}
.acts .do{background:var(--acc);color:var(--bg);border-color:var(--acc)}.acts .do span{color:oklch(30% .06 250)}
.acts .drop{color:var(--ink3)}
.hint{text-align:center;font-size:11.5px;color:var(--ink3);padding-bottom:14px}
</style></head><body>
<div class="hd"><div class="c">Decide · 7 of 12</div><div class="s">2 min left</div></div>
<div class="prog"><i></i></div>
<div class="mid">
  <div class="why">Sitting 27 days · blocking</div>
  <div class="q">Re-authenticate Credit Karma</div>
  <div class="meta">Blocking the <b>money board</b> since Aug 1.<br>Every finance snapshot has been stale since.<br>Takes about <b>3 minutes</b>.</div>
</div>
<div class="hint">← swipe to defer · swipe to do →</div>
<div class="acts">
  <button class="do">Do it now<span>opens Credit Karma</span></button>
  <button>Hand to K2<span>it'll chase you</span></button>
  <button>Not this week<span>ask me Monday</span></button>
  <button class="drop">Never<span>drop it</span></button>
</div>
</body></html>
